<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지영이 바보 메롱~</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #ffd6e8; --bg2: #d6ecff;
      --card: #ffffff; --line: #ffb3d1;
      --pink: #ff5fa2; --text: #7a6470; --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg1: #3a2233; --bg2: #1f2a3d;
        --card: #2b2230; --line: #a8527a;
        --pink: #ff8cc0; --text: #d9c5cf; --btn-text: #2b2230;
      }
    }
    :root[data-theme="dark"] {
      --bg1: #3a2233; --bg2: #1f2a3d;
      --card: #2b2230; --line: #a8527a;
      --pink: #ff8cc0; --text: #d9c5cf; --btn-text: #2b2230;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      padding: 16px; overflow: hidden;
      font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-color: var(--bg1);
    }
    .card {
      position: relative; z-index: 1; text-align: center;
      width: 100%; max-width: 380px; padding: 36px 28px 32px;
      background: var(--card); border: 3px solid var(--line);
      border-radius: 28px; box-shadow: 0 8px 0 var(--line);
      animation: bounce 2s ease-in-out infinite;
    }
    .face { font-size: 76px; line-height: 1; display: inline-block; animation: wiggle 1s ease-in-out infinite; }
    h1 { margin: 14px 0 8px; color: var(--pink); font-size: clamp(28px, 8vw, 36px); font-weight: 400; }
    p { color: var(--text); margin: 0 0 22px; font-size: 18px; min-height: 1.4em; }
    button {
      font: inherit; font-size: 18px; padding: 12px 26px;
      border: none; border-radius: 999px;
      background: var(--pink); color: var(--btn-text); cursor: pointer;
      transition: transform .1s;
    }
    button:active { transform: scale(0.92); }
    button:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
    .count { margin-top: 14px; font-size: 14px; color: var(--text); opacity: .75; min-height: 1.2em; }
    .float { position: absolute; bottom: -60px; font-size: 30px; opacity: .85; pointer-events: none; animation: up 7s linear infinite; }
    .pop { position: fixed; font-size: 28px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 2; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes wiggle { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
    @keyframes up { to { transform: translateY(-115vh) rotate(360deg); } }
    @keyframes pop { from { opacity: 1; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), -120px) scale(1.3); } }
    @media (prefers-reduced-motion: reduce) {
      .card, .face, .float, .pop { animation: none; }
      .float { display: none; }
    }
  </style>
</head>
<body>
  <span class="float" style="left:6%;  animation-delay:0s">💖</span>
  <span class="float" style="left:24%; animation-delay:2s">😝</span>
  <span class="float" style="left:44%; animation-delay:4s">🍓</span>
  <span class="float" style="left:64%; animation-delay:1s">🌸</span>
  <span class="float" style="left:84%; animation-delay:3s">👅</span>

  <main class="card">
    <div class="face" id="face" aria-hidden="true">😜</div>
    <h1>지영이 바보 메롱~</h1>
    <p id="msg" aria-live="polite">메롱메롱 약오르지?!</p>
    <button id="btn" type="button">눌러보시든가 👉</button>
    <div class="count" id="count"></div>
  </main>

  <script>
    const msgs  = ["메롱메롱 약오르지?!", "바보라고 했지 누가 뭐래~", "진짜 눌렀어? 역시 바보 ㅋㅋ", "한 번 더 누르면 바보 확정", "그래도 귀요미는 인정 💕"];
    const faces = ["😜", "😝", "🤪", "🙈", "🥰"];
    const pops  = ["💖", "😝", "💕", "🍓", "✨"];
    let i = 0, n = 0;
    const btn = document.getElementById("btn");
    btn.addEventListener("click", (e) => {
      i = (i + 1) % msgs.length;
      n++;
      document.getElementById("msg").textContent = msgs[i];
      document.getElementById("face").textContent = faces[i];
      document.getElementById("count").textContent = "바보 인증 " + n + "회 🏅";
      const r = btn.getBoundingClientRect();
      for (let k = 0; k < 5; k++) {
        const s = document.createElement("span");
        s.className = "pop";
        s.textContent = pops[k];
        s.style.left = (r.left + r.width / 2 - 14) + "px";
        s.style.top = (r.top - 10) + "px";
        s.style.setProperty("--dx", ((k - 2) * 40) + "px");
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 900);
      }
    });
  </script>
</body>
</html>
